<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — SACCI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a6b5a">
<link rel="icon" href="icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --teal-deep: #0f4c3a; --teal: #1a6b5a; --teal-pale: #e8f4f0; --ink: #1a1a1a; --ink-muted: #7a7a7a; --cream: #FDFCFA; --sand: #e8e4df; --red: #991b1b; --font: 'DM Sans', sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--cream); min-height: 100vh; display: flex; flex-direction: column; }
  .login-header { padding: 20px clamp(24px,4vw,48px); border-bottom: 1px solid var(--sand); display: flex; justify-content: space-between; align-items: center; }
  .login-header .brand-mark { font-family: var(--font); font-size: 1.2rem; font-weight: 700; color: var(--teal-deep); letter-spacing: 0.02em; text-decoration: none; }
  .login-header a { font-size: 0.84rem; color: var(--ink-muted); text-decoration: none; }
  .login-header a:hover { color: var(--teal); }
  .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 12px; padding: 44px 36px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid rgba(15,76,58,0.08); }
  .login-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--teal-pale); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .login-card h1 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .login-card .sub { font-size: 0.88rem; color: var(--ink-muted); text-align: center; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-muted); margin-bottom: 4px; }
  .form-group input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--sand); border-radius: 6px; font-family: var(--font); font-size: 0.9rem; outline: none; }
  .form-group input:focus { border-color: var(--teal); }
  .password-field { position: relative; }
  .password-field input { padding-right: 44px; }
  .password-toggle { position: absolute; right: 4px; top: 4px; bottom: 4px; width: 36px; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); }
  .password-toggle:hover { color: var(--teal); }
  .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .remember-row input { width: auto; margin: 0; }
  .remember-row label { font-size: 0.84rem; color: var(--ink-muted); cursor: pointer; }
  .login-btn { width: 100%; padding: 13px; background: var(--teal-deep); color: #fff; border: none; border-radius: 6px; font-family: var(--font); font-size: 0.92rem; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .login-btn:hover { background: var(--teal); }
  .login-error { display: none; background: #fef2f2; border: 1px solid #fecaca; color: var(--red); padding: 10px; border-radius: 6px; font-size: 0.84rem; margin-bottom: 14px; text-align: center; }
  .login-error.show { display: block; }
  .divider { text-align: center; margin: 24px 0; position: relative; }
  .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--sand); }
  .divider span { background: #fff; padding: 0 12px; font-size: 0.78rem; color: var(--ink-muted); position: relative; }
  .public-btn { width: 100%; padding: 12px; background: var(--teal-pale); color: var(--teal-deep); border: 1px solid rgba(15,76,58,0.15); border-radius: 6px; font-family: var(--font); font-size: 0.88rem; font-weight: 600; cursor: pointer; }
  .public-btn:hover { background: #d5ede5; }
  .login-footer { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--ink-muted); }
  .login-footer a { color: var(--teal); text-decoration: none; }
</style>
</head>
<body>

<div class="login-header">
  <a href="index.html" class="brand-mark">SACCI</a>
  <a href="index.html">← Back to Initiative</a>
</div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f4c3a" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Staff Portal</h1>
    <p class="sub">Sita Anandam Cancer Care Initiative</p>

    <div class="login-error" id="loginError">Invalid email or password</div>
    <div class="login-error" id="resetMsg" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534;"></div>

    <form id="loginForm" onsubmit="handleLogin(event); return false;">
      <div class="form-group"><label>Email</label><input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="username"></div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password">
          <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePassword()" aria-label="Show password">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Keep me signed in on this device</label>
      </div>
      <button class="login-btn" id="loginBtn" type="submit">Login</button>
      <p class="login-footer"><a href="#" onclick="showReset(event)">Forgot password?</a></p>
    </form>

    <div id="resetForm" style="display:none;">
      <div class="form-group"><label>Email</label><input type="email" id="resetEmail" placeholder="Enter your email" autocomplete="username"></div>
      <button class="login-btn" id="resetBtn" onclick="sendResetLink()">Send Reset Link</button>
      <p class="login-footer"><a href="#" onclick="showLogin(event)">← Back to login</a></p>
    </div>

    <p class="login-footer">Need help? <a href="mailto:gramagovernance@gmail.com">Contact us</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
<script>
  // Roles (staff: full edit, advisor: read-only) live in the `profiles` table,
  // keyed off the authenticated Supabase user — see supabase/schema.sql.
  function showError(msg) {
    var el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 3500);
  }

  function togglePassword() {
    var input = document.getElementById('password');
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    document.getElementById('passwordToggle').setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    document.getElementById('eyeIcon').innerHTML = showing
      ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.4 21.4 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.4 21.4 0 0 1-2.87 3.94M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }

  async function handleLogin(e) {
    if (e) e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('password').value;
    if (!email || !pass) { showError('Enter your email and password'); return; }
    // Only rebuild the client if "remember me" actually changed — otherwise we'd
    // end up with two GoTrueClient instances on the same storage key at once.
    var wantsRemember = document.getElementById('rememberMe').checked ? '1' : '0';
    if (localStorage.getItem(SACCI_REMEMBER_KEY) !== wantsRemember) {
      localStorage.setItem(SACCI_REMEMBER_KEY, wantsRemember);
      sb = sacciCreateClient();
    }
    document.getElementById('loginBtn').disabled = true;
    var { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    document.getElementById('loginBtn').disabled = false;
    if (error) { showError(error.message || 'Invalid email or password'); return; }
    window.location.href = 'portal.html';
  }

  function showReset(e) {
    e.preventDefault();
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('resetForm').style.display = 'block';
    document.getElementById('resetEmail').value = document.getElementById('email').value;
  }
  function showLogin(e) {
    e.preventDefault();
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
  }
  function showResetMsg(msg) {
    var el = document.getElementById('resetMsg');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 6000);
  }
  async function sendResetLink() {
    var email = document.getElementById('resetEmail').value.trim();
    if (!email) { showError('Enter your email'); return; }
    document.getElementById('resetBtn').disabled = true;
    var { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname.replace('portal-login.html', 'reset-password.html')
    });
    document.getElementById('resetBtn').disabled = false;
    if (error) { showError(error.message); return; }
    showResetMsg('If that email has an account, a reset link is on its way.');
    showLogin({ preventDefault: function(){} });
  }

  async function redirectIfLoggedIn() {
    var { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'portal.html';
  }
  redirectIfLoggedIn();
  // Pressing Back after a successful login can restore this page from the
  // browser's bfcache showing the pre-login form, even though the session is
  // still valid — re-check and bounce forward instead of looking logged out.
  window.addEventListener('pageshow', function(e) { if (e.persisted) redirectIfLoggedIn(); });
</script>
</body>
</html>
